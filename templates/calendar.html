{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Coaching Open / Off</h2><button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#add">+ Set Day</button></div><div class="card p-3"><div class="table-responsive"><table class="table"><tr><th>Date</th><th>Status</th><th>Note</th></tr>{% for d in days %}<tr><td>{{d.day_date}}</td><td><span class="badge {{'text-bg-success' if d.status=='Open' else 'text-bg-danger'}}">{{d.status}}</span></td><td>{{d.note}}</td></tr>{% endfor %}</table></div></div><div class="modal fade" id="add"><div class="modal-dialog"><div class="modal-content"><form method="post"><div class="modal-header"><h5>Set Coaching Day</h5></div><div class="modal-body"><label>Date</label><input class="form-control mb-2" type="date" name="day_date" value="{{today}}" required><label>Status</label><select class="form-select mb-2" name="status"><option>Open</option><option>Off</option></select><label>Note</label><input class="form-control" name="note"></div><div class="modal-footer"><button class="btn btn-dark">Save</button></div></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>{% endblock %}
