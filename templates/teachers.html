{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Teachers</h2><button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#add">+ Add Teacher</button></div><div class="card p-3"><div class="table-responsive"><table class="table"><tr><th>Name</th><th>Phone</th><th>Subject</th><th>Salary</th><th>Status</th></tr>{% for t in teachers %}<tr><td>{{t.name}}</td><td>{{t.phone}}</td><td>{{t.subject}}</td><td>৳{{t.salary}}</td><td>{{'Active' if t.active else 'Inactive'}}</td></tr>{% endfor %}</table></div></div><div class="modal fade" id="add"><div class="modal-dialog"><div class="modal-content"><form method="post"><div class="modal-header"><h5>Add Teacher</h5></div><div class="modal-body"><input class="form-control mb-2" name="name" placeholder="Name" required><input class="form-control mb-2" name="phone" placeholder="Phone"><input class="form-control mb-2" name="subject" placeholder="Subject"><input class="form-control" type="number" step="0.01" name="salary" placeholder="Salary"></div><div class="modal-footer"><button class="btn btn-dark">Save</button></div></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>{% endblock %}
