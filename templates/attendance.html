{% extends "base.html" %}{% block content %}<h2>Attendance</h2><form class="card p-3 mb-3" method="get"><div class="row align-items-end"><div class="col-md-4"><label>Date</label><input class="form-control" type="date" name="date" value="{{selected_date}}"></div><div class="col-md-2"><button class="btn btn-dark mt-3">Load</button></div></div></form><form method="post"><input type="hidden" name="date" value="{{selected_date}}"><div class="card p-3"><div class="table-responsive"><table class="table"><tr><th>ID</th><th>Name</th><th>Class/Batch</th><th>Status</th></tr>{% for s in students %}<tr><td>{{s.student_id}}</td><td>{{s.name}}</td><td>{{s.class_name}} / {{s.batch}}</td><td><select class="form-select" name="status_{{s.id}}"><option {% if s.status=='Present' %}selected{% endif %}>Present</option><option {% if s.status=='Absent' %}selected{% endif %}>Absent</option><option {% if s.status=='Late' %}selected{% endif %}>Late</option></select></td></tr>{% endfor %}</table></div><button class="btn btn-success">Save Attendance</button></div></form>{% endblock %}
