{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h2>Students</h2><button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#add">+ Add Student</button></div><div class="card p-3"><div class="table-responsive"><table class="table table-hover"><tr><th>ID</th><th>Name</th><th>Class</th><th>Batch</th><th>Phone</th><th>Fee</th><th>Status</th><th>Action</th></tr>{% for s in students %}<tr><td>{{s.student_id}}</td><td>{{s.name}}</td><td>{{s.class_name}}</td><td>{{s.batch}}</td><td>{{s.phone}}</td><td>৳{{s.monthly_fee}}</td><td>{{'Active' if s.active else 'Inactive'}}</td><td><a class="btn btn-sm btn-primary" href="{{url_for('marksheet',sid=s.id)}}">Marksheet</a> <form class="d-inline" method="post" action="{{url_for('toggle_student',sid=s.id)}}"><button class="btn btn-sm btn-outline-secondary">Toggle</button></form></td></tr>{% endfor %}</table></div></div>
<div class="modal fade" id="add"><div class="modal-dialog modal-lg"><div class="modal-content"><form method="post"><div class="modal-header"><h5>Add Student</h5></div><div class="modal-body"><div class="row g-2">
<div class="col-md-6"><label>Student ID</label><input class="form-control" name="student_id" required></div><div class="col-md-6"><label>Name</label><input class="form-control" name="name" required></div>
<div class="col-md-6"><label>Phone</label><input class="form-control" name="phone"></div><div class="col-md-6"><label>Guardian</label><input class="form-control" name="guardian"></div>
<div class="col-md-6"><label>Guardian Phone</label><input class="form-control" name="guardian_phone"></div><div class="col-md-6"><label>Class</label><input class="form-control" name="class_name"></div>
<div class="col-md-6"><label>Batch</label><input class="form-control" name="batch"></div><div class="col-md-6"><label>Admission Date</label><input class="form-control" type="date" name="admission_date"></div>
<div class="col-12"><label>Address</label><input class="form-control" name="address"></div><div class="col-md-6"><label>Monthly Fee</label><input class="form-control" type="number" step="0.01" name="monthly_fee"></div>
</div></div><div class="modal-footer"><button class="btn btn-dark">Save Student</button></div></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>{% endblock %}
