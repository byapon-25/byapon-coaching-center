{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Exams</h2><button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#addExam">+ New Exam</button></div><div class="card p-3"><div class="table-responsive"><table class="table"><tr><th>Title</th><th>Subject</th><th>Date</th><th>Full</th><th>Action</th></tr>{% for e in exams %}<tr><td>{{e.title}}</td><td>{{e.subject}}</td><td>{{e.exam_date}}</td><td>{{e.full_marks}}</td><td><a class="btn btn-sm btn-primary" href="{{url_for('marks',eid=e.id)}}">Enter Marks</a></td></tr>{% endfor %}</table></div></div><div class="modal fade" id="addExam"><div class="modal-dialog"><div class="modal-content"><form method="post"><div class="modal-header"><h5>New Exam</h5></div><div class="modal-body"><label>Title</label><input class="form-control mb-2" name="title" required><label>Date</label><input class="form-control mb-2" type="date" name="exam_date" required><label>Subject</label><input class="form-control mb-2" name="subject" required><label>Full Marks</label><input class="form-control mb-2" type="number" name="full_marks" value="100"><label>Pass Marks</label><input class="form-control" type="number" name="pass_marks" value="33"></div><div class="modal-footer"><button class="btn btn-dark">Create</button></div></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>{% endblock %}
