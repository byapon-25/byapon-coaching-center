<!doctype html><html lang="bn"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title or "Coaching CMS"}}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f4f6fa}.sidebar{min-height:100vh;background:#111827}.brand{font-size:20px;font-weight:800;color:white}
.sidebar a{display:block;color:#d1d5db;text-decoration:none;padding:10px 12px;border-radius:8px;margin:2px 0}.sidebar a:hover{background:#374151;color:#fff}
.card{border:0;box-shadow:0 3px 15px rgba(0,0,0,.06)}.stat{font-size:27px;font-weight:800}.table td,.table th{vertical-align:middle}
@media(max-width:768px){.sidebar{min-height:auto}.navs{display:flex;overflow:auto;gap:3px}.sidebar a{white-space:nowrap}.main{padding:15px!important}}
</style></head><body><div class="container-fluid"><div class="row">
<aside class="col-lg-2 sidebar p-3"><div class="brand mb-3">📚 Coaching CMS</div><div class="navs">
<a href="{{url_for('dashboard')}}">📊 Dashboard</a><a href="{{url_for('students')}}">👨‍🎓 Students</a>
<a href="{{url_for('attendance')}}">✅ Attendance</a><a href="{{url_for('exams')}}">📝 Exams</a>
<a href="{{url_for('finance')}}">💰 Finance</a><a href="{{url_for('calendar')}}">📅 Open/Off</a>
<a href="{{url_for('teachers')}}">👨‍🏫 Teachers</a><a href="{{url_for('routine')}}">🗓️ Routine</a>
<a href="{{url_for('logout')}}">🚪 Logout</a></div></aside>
<main class="col-lg-10 main p-4">{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
</div></div></body></html>
