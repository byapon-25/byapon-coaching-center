{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Class Routine</h2><button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#add">+ Add Class</button></div><div class="card p-3"><div class="table-responsive"><table class="table"><tr><th>Day</th><th>Batch</th><th>Subject</th><th>Teacher</th><th>Time</th></tr>{% for r in routines %}<tr><td>{{r.day_name}}</td><td>{{r.batch}}</td><td>{{r.subject}}</td><td>{{r.teacher}}</td><td>{{r.start_time}} - {{r.end_time}}</td></tr>{% endfor %}</table></div></div><div class="modal fade" id="add"><div class="modal-dialog"><div class="modal-content"><form method="post"><div class="modal-header"><h5>Add Routine</h5></div><div class="modal-body"><select class="form-select mb-2" name="day_name"><option>Saturday</option><option>Sunday</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option></select><input class="form-control mb-2" name="batch" placeholder="Batch"><input class="form-control mb-2" name="subject" placeholder="Subject"><input class="form-control mb-2" name="teacher" placeholder="Teacher"><div class="row"><div class="col"><input class="form-control" type="time" name="start_time"></div><div class="col"><input class="form-control" type="time" name="end_time"></div></div></div><div class="modal-footer"><button class="btn btn-dark">Save</button></div></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>{% endblock %}
