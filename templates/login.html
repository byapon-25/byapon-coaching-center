<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#111827}.box{max-width:420px;margin:12vh auto}</style></head><body><div class="box card p-4"><h2>📚 Coaching CMS</h2><p class="text-muted">Admin Login</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><input class="form-control mb-3" name="username" placeholder="Username" required><input class="form-control mb-3" name="password" type="password" placeholder="Password" required><button class="btn btn-dark w-100">Login</button></form><small class="text-muted d-block mt-3">Default: admin / admin123</small></div></body></html>
