{% extends "base.html" %}{% block content %}<h2>{{exam.title}} — {{exam.subject}}</h2><p>Full Marks: {{exam.full_marks}} | Pass Marks: {{exam.pass_marks}}</p><form method="post"><div class="card p-3"><div class="table-responsive"><table class="table"><tr><th>ID</th><th>Name</th><th>Marks</th></tr>{% for s in students %}<tr><td>{{s.student_id}}</td><td>{{s.name}}</td><td><input class="form-control" type="number" step="0.01" min="0" max="{{exam.full_marks}}" name="mark_{{s.id}}" value="{{s.marks}}"></td></tr>{% endfor %}</table></div><button class="btn btn-success">Save Marks</button></div></form>{% endblock %}
